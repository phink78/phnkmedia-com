<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina niet gevonden — PHNK Media</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.phnkmedia.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;700;900&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f7f4;
    --text: #2a2838;
    --muted: #7a788a;
    --accent: #ff3c6e;
    --accent2: #7c3fff;
    --heading: #12111e;
    --mono: 'DM Mono', monospace;
    --display: 'Unbounded', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }
  .container { max-width: 480px; }
  .code {
    font-family: var(--display);
    font-size: clamp(4rem, 15vw, 8rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
  }
  h1 {
    font-family: var(--display);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--heading);
    margin: 1rem 0 0.5rem;
  }
  p { color: var(--muted); margin-bottom: 2rem; }
  a {
    display: inline-block;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 0.6rem 1.5rem;
    border-radius: 6px;
    transition: background 0.2s, color 0.2s;
  }
  a:hover { background: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Pagina niet gevonden</h1>
    <p>Deze pagina bestaat niet of is verplaatst.</p>
    <a href="/">Terug naar phnkmedia.com</a>
  </div>
</body>
</html>
